name: generate animation

on:
  # refresh the contribution snake every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # and whenever the profile README changes
  push:
    branches: [main]
  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate contribution snake (gold theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1a1a2e&color_dots=#ebedf0,#f0e4c8,#dcc28e,#c8a96e,#8b7340
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#3d3220,#6b5530,#a08048,#c8a96e

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
